name: Fire TV APK

# Builds the CleanFrame Fire TV app from app/ and android/, and publishes it as the
# "firetv-latest" release so the Fire TV Downloader app can fetch it from a fixed address:
# https://github.com/<you>/<repo>/releases/download/firetv-latest/CleanFrame-FireTV.apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android/**'
      - 'package.json'
      - 'scripts/airplay/**'
      - '.github/workflows/firetv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firetv-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Optional: a stable signing key (see docs/firetv.md). Without it each build gets a fresh
      # debug key, and installing a newer build first needs the old one uninstalled.
      - name: Restore signing key
        env:
          CF_KEYSTORE_BASE64: ${{ secrets.CF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CF_KEYSTORE_BASE64" ]; then
            printf '%s' "$CF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cleanframe.keystore"
            echo "CF_KEYSTORE=$RUNNER_TEMP/cleanframe.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No CF_KEYSTORE_BASE64 secret. This APK uses a temporary debug key; uninstall the previous build before installing it."
          fi

      # The AirPlay receiver's protocol, crypto and codecs against independent references (fake iPhone
      # included). A failure is shown on the run but does not hold back the APK.
      - name: Test the AirPlay receiver
        continue-on-error: true
        run: bash scripts/airplay/test.sh

      - name: Build
        working-directory: android
        env:
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CleanFrame-FireTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-FireTV
          path: CleanFrame-FireTV.apk

      - name: Publish the firetv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firetv-latest --yes --cleanup-tag || true
          gh release create firetv-latest CleanFrame-FireTV.apk \
            --target "$GITHUB_SHA" \
            --title "CleanFrame für Fire TV (Build $GITHUB_RUN_NUMBER)" \
            --notes "Installieren: Downloader-App auf dem Fire TV → https://github.com/$GITHUB_REPOSITORY/releases/download/firetv-latest/CleanFrame-FireTV.apk" \
            --latest=false
